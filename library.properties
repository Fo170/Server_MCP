name=Server_MCP
version=1.3.2
author=Olivier FOURNET
maintainer=Olivier FOURNET <olivier.fournet@free.fr>
sentence=Serveur MCP (Model Context Protocol) pour ESP8266/ESP32 — JSON-RPC 2.0 over HTTP, outils/ressources, contrôle de flux pondéré + backpressure mémoire (XON/XOFF).
paragraph=Un header-only, dépendance ArduinoJson 7.x. Implémente initialize, tools/list, tools/call, resources, ping. Contrôle de flux "style TCP" : fenêtre de canaux glissante pondérée par outil, rejet HTTP 429 + Retry-After/X-RateLimit, backpressure mémoire XON/XOFF (setFlowPression), seuls tools/call consomment des canaux.
category=Data Processing
url=https://github.com/Fo170/Server_MCP
architectures=esp8266,esp32
